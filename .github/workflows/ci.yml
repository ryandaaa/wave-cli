name: CI - Multi-OS Matrix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test (${{ matrix.os }}, Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            is-linux: true

          - os: ubuntu-latest
            python-version: "3.11"
            is-linux: true

          - os: ubuntu-latest
            python-version: "3.12"
            is-linux: true

          - os: macos-latest
            python-version: "3.12"
            is-macos: true

          - os: windows-latest
            python-version: "3.12"
            is-windows: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (Linux)
        if: matrix.is-linux
        run: |
          sudo apt-get update
          sudo apt-get install -y mpv

      - name: Install system dependencies (macOS)
        if: matrix.is-macos
        run: |
          brew install mpv

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio platformdirs yt-dlp

      - name: Verify CLI flags and packaging
        run: |
          python main.py --help
          python main.py --version

      - name: Run test suite (Linux & macOS)
        if: '!matrix.is-windows'
        run: |
          pytest tests/test_audio_cache.py \
                 tests/test_database.py \
                 tests/test_two_tier_queue.py \
                 tests/test_import_playlist.py \
                 tests/test_repeat_shuffle_fav.py \
                 tests/e2e/test_tier1_feature_coverage.py -k "test_cli or test_pyproject"

      - name: Run test suite (Windows)
        if: matrix.is-windows
        run: |
          pytest tests/test_audio_cache.py \
                 tests/test_database.py \
                 tests/test_import_playlist.py \
                 tests/test_repeat_shuffle_fav.py \
                 tests/e2e/test_tier1_feature_coverage.py -k "test_cli or test_pyproject"

      - name: Test installer script in dev mode (Linux only)
        if: matrix.is-linux
        run: |
          ./install.sh --dev
          ~/.local/bin/wave --version
