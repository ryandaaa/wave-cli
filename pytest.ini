[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -v --strict-markers
markers =
    tier1: Tier 1 Feature Coverage tests
    tier2: Tier 2 Boundary & Corner cases
    tier3: Tier 3 Cross-feature combination workflows
    tier4: Tier 4 Real-world user application scenarios
